name: MSI test build

on:
  push:
    branches:
      - 'feature/windows-per-user-install-*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-binaries:
    runs-on: macos-14
    env:
      PRISMA_CLI_BINARY_TARGETS: darwin,darwin-arm64,windows,debian-openssl-3.0.x,linux-arm64-openssl-3.0.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PNPM
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Prisma client
        run: pnpm --filter @app/backend prisma:generate

      - name: Prepare toolchain
        run: pnpm install:all

      - name: Ensure build scripts
        run: pnpm neu:build-scripts

      - name: Build installers
        # generate-updater-assets requires a tag that matches the app version
        run: |
          export GITHUB_REF_NAME="v$(node -p "require('./package.json').version")"
          pnpm build:installers

      - name: Upload raw dist outputs
        uses: actions/upload-artifact@v4
        with:
          name: dist-binaries
          path: |
            dist/
            resources/
          include-hidden-files: true
          if-no-files-found: error

  package-windows:
    runs-on: windows-2022
    needs: build-binaries

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist from build
        uses: actions/download-artifact@v4
        with:
          name: dist-binaries
          path: .

      - name: Set up PNPM
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install WiX Toolset
        # Same as release.yml
        run: |
          $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3111rtm/wix311.exe"
          $wixInstaller = "$env:TEMP\wix311.exe"
          Invoke-WebRequest -Uri $wixUrl -OutFile $wixInstaller -UseBasicParsing
          Start-Process -FilePath $wixInstaller -ArgumentList "/quiet", "/norestart" -Wait -NoNewWindow
          Remove-Item -Force $wixInstaller
          Start-Sleep -Seconds 3
          $wixPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files\WiX Toolset v3.11\bin"
          )
          $wixBinPath = $null
          foreach ($wixPath in $wixPaths) {
            if (Test-Path "$wixPath\candle.exe") {
              $wixBinPath = $wixPath
              break
            }
          }
          if ($wixBinPath) {
            echo "WIX=$wixBinPath" >> $env:GITHUB_ENV
            echo "PATH=$wixBinPath;$env:PATH" >> $env:GITHUB_ENV
          } else {
            Write-Host "WiX 3.11 not found; package.mjs falls back to candle.exe on PATH"
          }

      - name: Show WiX in use
        run: |
          Get-Command candle.exe, light.exe, heat.exe -ErrorAction SilentlyContinue | Format-Table Name, Source -AutoSize
          Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -ErrorAction SilentlyContinue | Select-Object Name

      - name: Package Windows (ZIP + MSI)
        run: pnpm package:win

      - name: Assert MSI was created
        # package.mjs only logs a warning when light.exe fails
        run: if (-not (Test-Path dist/installers/NodeRef-win-x64.msi)) { throw "MSI not created" }

      - name: Smoke test per-user install
        run: |
          $p = Start-Process msiexec -ArgumentList '/i', 'dist\installers\NodeRef-win-x64.msi', '/qn', 'ALLUSERS=""', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec failed: $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Apps\NodeRef\NodeRef.exe"
          if (-not (Test-Path $exe)) { throw "Not installed per-user at $exe" }
          Write-Host "Per-user install OK: $exe"

      - name: Upload Windows installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-installers
          path: |
            dist/installers/NodeRef-win-*.msi
            install.log
          if-no-files-found: warn
